[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6-modern-widgets"
version = "0.2.0"
description = "Cross-platform modern frameless windows, navigation, and tabs for PySide6"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "pyside6-modern-widgets contributors" }]
dependencies = ["PySide6==6.8.3"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-pyinstaller>=6.11",
]

[project.entry-points.pyinstaller40]
hook-dirs = "pyside6_modern_widgets._pyinstaller:get_hook_dirs"

[project.urls]
Repository = "https://github.com/zero-ljz/pyside6-modern-widgets"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyside6_modern_widgets = [
    "py.typed",
    "resources.qrc",
    "resources/icons/*.png",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/pyside6_modern_widgets/_pyinstaller/hook-*.py" = ["N999"]

[tool.ruff.format]
exclude = ["src/pyside6_modern_widgets/_resources.py"]
