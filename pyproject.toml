[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6-modern-widgets"
version = "0.1.2"
description = "Modern frameless windows, navigation, and tabs for PySide6 on Windows"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "pyside6-modern-widgets contributors" }]
dependencies = ["PySide6==6.8.3"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/zero-ljz/pyside6-modern-widgets"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyside6_modern_widgets = [
    "py.typed",
    "resources.qrc",
    "resources/icons/*.png",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
